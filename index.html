<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeBroker.cz – online platforma pro realitní makléře</title>
    <meta name="description" content="BeBroker.cz, online platforma pro realitní makléře. Spouštíme brzy.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="logo-ikona.png">
    <style>
        @font-face { font-family: Montserrat; font-weight: 800; font-display: swap; src: url('fonts/montserrat-800-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC; }
        @font-face { font-family: Montserrat; font-weight: 800; font-display: swap; src: url('fonts/montserrat-800-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
        :root { --bg: #EAF2F0; --ink: #12303A; --card: #fff; --line: #C5D8D4; --muted: #44636B; --teal: #0F5C63; --accent: #F5B700; color-scheme: light; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0C1F24; --ink: #E4EFEC; --card: #16373F; --line: #24474F; --muted: #9DB8B8; --teal: #5FC2C0; color-scheme: dark; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 1.05rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { flex: 1; display: grid; place-items: center; padding: 3rem 1.25rem; }
        .card { width: min(560px, 100%); background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--teal); border-radius: 14px; padding: 2.4rem 2.2rem; text-align: center; }
        .brand { display: inline-flex; align-items: center; gap: .6rem; margin-bottom: 1.6rem; }
        .brand img { height: 52px; width: auto; }
        .wordmark { font: 800 1.9rem/1 Montserrat, system-ui, sans-serif; letter-spacing: -.01em; }
        .wordmark .be { background: linear-gradient(180deg, #6FE7F7, #1FA6D4); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h1 { font: 700 1.55rem/1.3 Georgia, serif; margin: 0 0 .6rem; }
        .soon { display: inline-block; margin: .2rem 0 1.4rem; padding: .25rem .9rem; border-radius: 99px; background: var(--accent); color: #2A2000; font-weight: 700; font-size: .95rem; }
        p { margin: 0 0 1rem; color: var(--muted); }
        .contact { display: grid; gap: .4rem; margin-top: 1.4rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }
        .contact a { color: var(--teal); font-weight: 600; text-decoration: none; }
        .contact a:hover { text-decoration: underline; }
        footer { padding: 1.2rem; text-align: center; font-size: .85rem; color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <div class="brand">
                <img src="logo-ikona.png" alt="" width="73" height="52">
                <span class="wordmark"><span class="be">Be</span>Broker</span>
            </div>
            <h1>Online platforma pro realitní makléře</h1>
            <span class="soon">Spouštíme brzy</span>
            <p>Chcete vědět o spuštění mezi prvními? Ozvěte se nám.</p>
            <div class="contact">
                <a href="mailto:jindrich.zemlicka@gmail.com">jindrich.zemlicka@gmail.com</a>
                <a href="tel:+420777911390">+420 777 911 390</a>
            </div>
        </div>
    </main>
    <footer>
        BeBroker.cz provozuje Creative Coach s.r.o., IČO 28645286, DIČ CZ28645286, V. Talicha 339, 277 42 Obříství.
    </footer>
</body>
</html>
